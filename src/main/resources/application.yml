server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: intelligent-collaborative-clound-gallery
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_gallery?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 12345678
mybatis-plus:
    configuration:
        map-underscore-to-camel-case: false
        # 打印SQL日志(开发环境使用，生产环境请关闭)
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 严某的接口文档
    url: https://docs.xiaominfo.com
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.ym.intelligentcollaborativecloudgallery.controller